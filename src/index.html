<!doctype html>
<html lang="ro">

<head>
  <meta charset="utf-8">
  <title>Invitație Nuntă | Bianca & Alex</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Suntem încântați să vă invităm la nunta noastră!">
  <meta name="theme-color" content="#ededed">
  <link rel="canonical" href="https://www.invitatie.rsasoft.ro/">

  <!-- Link previews (LinkedIn, WhatsApp, Slack...). Crawlers don't run JS, so these stay static.
       LinkedIn needs an absolute image URL; 1200x627 is its native card size. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="RSA SOFT" />
  <meta property="og:url" content="https://www.invitatie.rsasoft.ro/" />
  <meta property="og:title" content="Bianca & Alex · A digital wedding invitation (live demo)" />
  <meta property="og:description"
    content="RSVP with menus and allergies, live countdown, calendar invite, and it opens in each guest's own language (16 languages). Designed & built by Alex & Bianca Rusu, RSA SOFT." />
  <meta property="og:image" content="https://www.invitatie.rsasoft.ro/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="627" />
  <meta property="og:image:alt" content="Bianca and Alex, digital wedding invitation built by RSA SOFT" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="author" content="Alex & Bianca Rusu, RSA SOFT">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- The hero photo is the largest element on screen: start downloading it right away instead of
       waiting for the app to render it. Must match the srcset/sizes of the <img> in app.html. -->
  <link rel="preload" as="image" href="/hero-1080.webp"
    imagesrcset="/hero-480.webp 480w, /hero-720.webp 720w, /hero-1080.webp 1080w"
    imagesizes="(max-width: 500px) calc(100vw - 48px), 452px" fetchpriority="high">

  <!-- Fetch the visitor's translations in parallel with the app bundle instead of after it.
       Same detection as src/app/i18n/languages.ts: keep the language list in sync when adding one. -->
  <script>
    (function () {
      var langs = ['ro', 'en', 'de', 'fr', 'it', 'es', 'pt', 'nl', 'da', 'sv', 'pl', 'cs', 'sk', 'uk', 'ru', 'ar'];
      var prefs = [new URLSearchParams(location.search).get('lang')]
        .concat(navigator.languages || [], navigator.language);
      var lang = 'en';
      for (var i = 0; i < prefs.length; i++) {
        var base = String(prefs[i] || '').trim().toLowerCase().split(/[-_]/)[0];
        if (base === 'mo') base = 'ro';
        if (langs.indexOf(base) > -1) { lang = base; break; }
      }
      var link = document.createElement('link');
      link.rel = 'preload';
      link.as = 'fetch';
      link.crossOrigin = 'anonymous';
      link.href = '/i18n/' + lang + '.json';
      document.head.appendChild(link);
    })();
  </script>

  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Cormorant Garamond for main elegant text, Pinyon Script for calligraphy.
       Great Vibes (Cyrillic calligraphy), Amiri and Aref Ruqaa (Arabic) are fallbacks, fetched only when needed. -->
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Pinyon+Script&family=Great+Vibes&family=Amiri:wght@400;700&family=Aref+Ruqaa&display=swap"
    rel="stylesheet">
</head>

<body>
  <app-root></app-root>
</body>

</html>
